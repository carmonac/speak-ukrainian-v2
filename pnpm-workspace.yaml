packages:
  - 'apps/*'
  - 'packages/*'
  - 'scripts'

# Native/postinstall builds we explicitly trust.
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': false
  '@nestjs/core': false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  # Cloudflare's Workers runtime, needed by wrangler (local dev and deploy).
  workerd: true
