# Production stack for a single VPS. Supabase (database, auth, storage,
# realtime) is the hosted service; everything here is stateless.
#
#   cp .env.example .env   # fill it in, including DOMAIN
#   docker compose -f docker-compose.prod.yml up -d --build
#
# DNS: point DOMAIN, www.DOMAIN, admin.DOMAIN and student.DOMAIN at this server.
# See docs/deployment.md.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. speakukrainian.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin
      - student

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
      # Derived from DOMAIN so the four URLs can never disagree.
      PUBLIC_SITE_URL: https://${DOMAIN}
      STUDENT_APP_URL: https://student.${DOMAIN}
      ADMIN_APP_URL: https://admin.${DOMAIN}
      CORS_ORIGINS: https://admin.${DOMAIN},https://student.${DOMAIN}
      H5P_BASE_URL: https://${DOMAIN}/api/h5p
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: admin
    restart: unless-stopped
    environment: &spa-environment
      API_URL: https://${DOMAIN}/api
      SITE_URL: https://${DOMAIN}
      STUDENT_URL: https://student.${DOMAIN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}

  student:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: student
    restart: unless-stopped
    environment: *spa-environment

volumes:
  caddy_data:
  caddy_config:
